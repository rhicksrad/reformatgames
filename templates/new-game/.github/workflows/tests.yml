name: Tests

# Runs the whole suite (tools/ci/run_tests.sh) on ready pull requests that
# touch more than docs, nightly on main, and by hand. Drafts and docs-only
# changes skip it; they merge on the pre-push hook. Set the repo variable
# CI_RUNNER to send the job to the studio's self-hosted runners (no Actions
# minutes); unset, it runs on ubuntu-latest.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  headless-tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_RUNNER && fromJSON('["self-hosted","godot-mono"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: .NET
        if: ${{ !vars.CI_RUNNER }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Godot .NET
        if: ${{ !vars.CI_RUNNER }}
        run: |
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -sSL -o godot.zip "$url"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$(ls -d "$HOME"/godot/*/Godot_v*_mono_linux.x86_64)" >> "$GITHUB_ENV"
      - name: Suite
        run: tools/ci/run_tests.sh
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: .dev/ci/
